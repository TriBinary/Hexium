# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Hexium
# mod_version is the only source of the version number. Changing it on main
# in TriBinary/Hexium publishes a release (see docs/RELEASING.md).
mod_version=0.1.0
archives_base_name=hexium
group=net.trilleo

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Kotlin
kotlin_version=2.4.21
fabric_kotlin_version=1.14.2+kotlin.2.4.21
# Must stay on the version Fabric Language Kotlin bundles: the mod doesn't ship its own.
# When bumping fabric_kotlin_version, also raise its minimum in fabric.mod.json.
kotlinx_serialization_version=1.11.0

# Tests
jqwik_version=1.9.3
